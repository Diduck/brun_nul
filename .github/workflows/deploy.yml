name: Deploy sur la VM Proxmox

on:
  push:
    branches: [main]
  workflow_dispatch: # lancement manuel depuis l'onglet Actions

# Un seul déploiement à la fois
concurrency:
  group: deploy-proxmox
  cancel-in-progress: false

env:
  IMAGE_NAME: brun_nul
  CONTAINER_NAME: brun_nul
  HOST_PORT: 8080       # port exposé sur la VM
  CONTAINER_PORT: 80    # port écouté dans le conteneur (à adapter au Dockerfile)

jobs:
  deploy:
    # Runner auto-hébergé installé sur la VM Proxmox (voir scripts/install-runner.sh)
    runs-on: [self-hosted, linux, proxmox]

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Vérifier la présence du Dockerfile
        run: |
          if [ ! -f Dockerfile ]; then
            echo "::error::Aucun Dockerfile à la racine du repo"
            exit 1
          fi

      - name: Construire l'image
        run: |
          docker build \
            -t "$IMAGE_NAME:${{ github.sha }}" \
            -t "$IMAGE_NAME:latest" .

      - name: Remplacer le conteneur
        run: |
          docker rm -f "$CONTAINER_NAME" 2>/dev/null || true
          docker run -d \
            --name "$CONTAINER_NAME" \
            --restart unless-stopped \
            -p "$HOST_PORT:$CONTAINER_PORT" \
            "$IMAGE_NAME:${{ github.sha }}"

      - name: Vérifier que le site répond
        run: |
          for i in $(seq 1 15); do
            if curl -fsS "http://localhost:$HOST_PORT" > /dev/null; then
              echo "Site en ligne sur le port $HOST_PORT"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Le site ne répond pas après 30 secondes"
          docker logs "$CONTAINER_NAME"
          exit 1

      - name: Nettoyer les anciennes images
        if: success()
        run: docker image prune -f
